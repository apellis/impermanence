name: Android startup profile

# Records the app's startup profile on an emulator and commits it as
# android/app/src/main/baseline-prof.txt, which makes the app open faster on first launch.
# Runs on a pull request that changes the generator, and by hand from the Actions tab
# (for example before a release, after big UI changes).
on:
  pull_request:
    paths: ["android/baselineprofile/**", ".github/workflows/baseline-profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Record startup profile (emulator API 34)
    # Only for branches in this repository, which the token can push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :baselineprofile:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
      - name: Copy the profile into the app
        run: |
          profile=$(find android/baselineprofile/build/outputs -name '*-baseline-prof.txt' ! -name '*startup*' | head -n 1)
          if [ -z "$profile" ]; then
            echo "No baseline profile was produced"; find android/baselineprofile/build/outputs -type f; exit 1
          fi
          echo "Using $profile ($(wc -l < "$profile") rules)"
          cp "$profile" android/app/src/main/baseline-prof.txt
      - name: Commit the profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/baseline-prof.txt
          if git diff --cached --quiet; then echo "Profile unchanged"; exit 0; fi
          git commit -m "Android: update the startup profile"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-profile
          path: android/baselineprofile/build/outputs/
