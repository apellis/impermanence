name: Android

on:
  push:
    branches: [master]
    paths: ["android/**", "scripts/setup-android-sdk.sh", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "scripts/setup-android-sdk.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: impermanence-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  emulator:
    name: Instrumented tests (emulator API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented-reports-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/

  cloud-sdk-script:
    # Checks that scripts/setup-android-sdk.sh works from a bare Linux image,
    # the same way a Claude Code cloud session uses it.
    name: SDK setup script on bare Linux
    runs-on: ubuntu-latest
    container: eclipse-temurin:17-jdk
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        working-directory: .
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Install Android SDK with repo script
        working-directory: .
        run: ANDROID_HOME=/opt/android-sdk scripts/setup-android-sdk.sh
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
